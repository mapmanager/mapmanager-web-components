site_name: MapManager Web Components
site_url: https://mapmanager.github.io/mapmanager-web-components/
repo_url: https://github.com/mapmanager/mapmanager-web-components
repo_name: mapmanager/mapmanager-web-components

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Image Viewer:
      - Overview: image-viewer/index.md
      - Sources: image-viewer/sources.md
      - Vue integration: image-viewer/vue-integration.md
      - Custom Element: image-viewer/custom-element.md
      - OME-Zarr: image-viewer/ome-zarr.md
      - Overlays and ROIs: image-viewer/overlays-and-rois.md
      - Architecture: image-viewer/architecture.md
  - NicePool:
      - Overview: nicepool/index.md
      - Architecture: nicepool/architecture.md
      - Data and selection API: nicepool/data-and-selection-api.md
      - Plot and summary semantics: nicepool/plot-and-summary-semantics.md
      - State and presets: nicepool/state-and-presets.md
      - Preset persistence: nicepool/preset-persistence.md
      - PyQt5 integration: nicepool/pyqt5-integration.md
      - Changelog: nicepool/CHANGELOG.md
  - Signal Viewer:
      - Overview: signal-viewer/index.md
      - Data sources: signal-viewer/data-sources.md
      - Vue integration: signal-viewer/vue-integration.md
      - Custom Element: signal-viewer/custom-element.md
      - Overlays and cursors: signal-viewer/overlays-and-cursors.md
      - Interaction and display: signal-viewer/interaction-and-display.md
      - Architecture: signal-viewer/architecture.md
  - Live demos:
      - Image Viewer: https://mapmanager.github.io/mapmanager-web-components/demos/image-viewer/
      - NicePool: https://mapmanager.github.io/mapmanager-web-components/demos/nicepool/
      - Signal Viewer: https://mapmanager.github.io/mapmanager-web-components/demos/signal-viewer/
  - Example clients: clients.md
  - Development: development.md

strict: true
